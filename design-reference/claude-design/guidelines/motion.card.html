<!-- @dsCard group="Foundations" viewport="700x130" subtitle="Standard ease, hover darken, no bounce" name="Motion" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:14px;height:130px;align-items:center;font-family:var(--font-sans-body);padding:4px">
<button style="background:var(--accent-primary);color:#fff;border:none;border-radius:var(--radius-pill);padding:10px 22px;font-size:14px;transition:background var(--duration-standard) var(--ease-standard)" onmouseover="this.style.background='var(--accent-primary-hover)'" onmouseout="this.style.background='var(--accent-primary)'">Hover me</button>
<span style="font-size:12px;color:var(--text-secondary);max-width:420px">duration-standard: 240ms · ease-standard: cubic-bezier(.4,0,.2,1) · darken on hover, no scale/bounce</span>
</div>
