<!-- @dsCard group="Colors" viewport="700x170" subtitle="bg / text / accent aliases in use" name="Semantic Aliases" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:10px;height:170px;font-family:var(--font-sans-body);background:var(--bg-page);padding:10px;box-sizing:border-box">
<div style="flex:1;background:var(--bg-surface);border-radius:var(--radius-m);box-shadow:var(--shadow-card);padding:14px;display:flex;flex-direction:column;gap:6px">
<span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-eyebrow)">Eyebrow</span>
<span style="font-family:var(--font-serif-display);font-size:20px;color:var(--text-primary)">Text primary</span>
<span style="font-size:13px;color:var(--text-secondary)">Text secondary</span>
<a href="#" style="font-size:13px;color:var(--link-color)">A link in body copy</a>
</div>
<div style="flex:1;background:var(--bg-inverse);border-radius:var(--radius-m);padding:14px;display:flex;flex-direction:column;gap:8px;justify-content:center;align-items:center">
<span style="color:var(--text-on-inverse);font-family:var(--font-serif-display);font-size:18px">Inverse surface</span>
<button style="background:var(--accent-secondary);color:#fff;border:none;border-radius:var(--radius-pill);padding:8px 18px;font-family:var(--font-sans-body);font-size:13px">Accent Secondary</button>
</div>
</div>
